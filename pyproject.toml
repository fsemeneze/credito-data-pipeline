[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credito-pipeline"
version = "0.1.0"
description = "Pipeline de dados para análise de inadimplência de clientes de cartão de crédito"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Felipe S. Menezes" }]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "pandera>=0.18",
    "duckdb>=0.10",
]

[project.scripts]
credito = "credito_pipeline.cli:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
